    function App() {
      const [lang, setLang] = useState('en');
      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedScheme, setSelectedScheme] = useState(null);
      
      const [schemesList, setSchemesList] = useState(INITIAL_SCHEMES);

      // Auth State
      const [currentUser, setCurrentUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authRole, setAuthRole] = useState('citizen');
      const [authMode, setAuthMode] = useState('login'); 
      const [authEmail, setAuthEmail] = useState('');
      const [authName, setAuthName] = useState('');
      const [authPassword, setAuthPassword] = useState('');

      // Admin Add Scheme State
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [newCategory, setNewCategory] = useState('pensions');

      // Chat state
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: translations[lang].chatWelcome }
      ]);
      const [chatInput, setChatInput] = useState('');

      // Finder State
      const [finderForm, setFinderForm] = useState({ goal: 'all' });
      const [finderResults, setFinderResults] = useState(null);

      const t = translations[lang];

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, currentUser, selectedScheme, showAuthModal]);

      // Navigation protection: If not logged in, force to 'home' for any protected tab
      const handleTabSwitch = (tab) => {
        if (tab !== 'home' && !currentUser) {
          setShowAuthModal(true);
          return;
        }
        setActiveTab(tab);
      };

      // Filter Schemes
      const filteredSchemes = useMemo(() => {
        return schemesList.filter(s => {
          const title = lang === 'te' ? s.title_te : s.title_en;
          const desc = lang === 'te' ? s.description_te : s.description_en;
          const matchesSearch = title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                desc.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCategory = selectedCategory === 'all' || s.category === selectedCategory;
          return matchesSearch && matchesCategory;
        });
      }, [schemesList, searchQuery, selectedCategory, lang]);

      // Chat handler
      const handleSendMessage = (textToSend) => {
        const query = textToSend || chatInput;
        if (!query.trim()) return;

        const newMessages = [...chatMessages, { sender: 'user', text: query }];
        setChatMessages(newMessages);
        setChatInput('');

        setTimeout(() => {
          let botReply = lang === 'te' 
            ? "క్షమించండి, మీ ప్రశ్నకు నిర్దిష్ట సమాచారం లభించలేదు. దయచేసి గ్రామ సచివాలయాన్ని సంప్రదించండి." 
            : "I am providing automated guidance based on verified records. For exact eligibility, please consult your local Village Secretariat.";

          const qLower = query.toLowerCase();
          if (qLower.includes('pension') || qLower.includes('పింఛన్') || qLower.includes('bharosa')) {
            botReply = lang === 'te'
              ? "ఎన్టీఆర్ భరోసా పింఛన్ కింద నెలకు ₹3,000 నుండి ₹6,000 వరకు అందజేస్తారు. కావలసిన పత్రాలు: ఆధార్ కార్డ్, వైట్ రేషన్ కార్డ్, బ్యాంకు పాస్‌బుక్."
              : "NTR Bharosa Pension provides ₹3,000 to ₹6,000 monthly. Documents needed: Aadhaar Card, White Ration Card, Bank Passbook.";
          } else if (qLower.includes('farmer') || qLower.includes('rythu') || qLower.includes('రైతు') || qLower.includes('sukhibhava')) {
            botReply = lang === 'te'
              ? "అన్నదాత సుఖీభవ పథకం ద్వారా రైతులకు వార్షిక పెట్టుబడి సహాయం లభిస్తుంది. పట్టాదారు పాస్‌బుక్ మరియు ఆధార్ కార్డ్ అవసరం."
              : "Annadata Sukhibhava provides annual crop investment support. Documents required: Pattadar Passbook and Aadhaar Card.";
          } else if (qLower.includes('student') || qLower.includes('education') || qLower.includes('తల్లికి వందనం') || qLower.includes('talliki')) {
            botReply = lang === 'te'
              ? "తల్లికి వందనం ద్వారా విద్యార్థుల తల్లులకు ఆర్థిక సహాయం లభిస్తుంది. కావలసినవి: విద్యార్థి ఐడీ, తల్లి ఆధార్, రేషన్ కార్డ్."
              : "Talliki Vandanam offers financial support to mothers for children's education. Documents needed: Student admission ID, Mother's Aadhaar, Ration Card.";
          } else if (qLower.includes('gas') || qLower.includes('deepam') || qLower.includes('lpg')) {
            botReply = lang === 'te'
              ? "దీపం 2.0 కింద సంవత్సరానికి మూడు ఉచిత గ్యాస్ సిలిండర్ల రీఫిల్స్ లభిస్తాయి. రేషన్ కార్డ్ మరియు గ్యాస్ పాస్‌బుక్ అవసరం."
              : "Deepam 2.0 provides 3 free LPG refills annually. Required: Ration Card and Gas Passbook.";
          }

          setChatMessages([...newMessages, { sender: 'bot', text: botReply }]);
        }, 600);
      };

      // Handle Finder Submission
      const handleFinderSubmit = (e) => {
        e.preventDefault();
        const results = schemesList.filter(s => {
          if (finderForm.goal === 'pension' && s.category === 'pensions') return true;
          if (finderForm.goal === 'education' && s.category === 'education') return true;
          if (finderForm.goal === 'agriculture' && s.category === 'agriculture') return true;
          if (finderForm.goal === 'women' && s.category === 'women') return true;
          return finderForm.goal === 'all';
        });
        setFinderResults(results);
      };

      // Handle Auth Form Submission
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const userObj = {
          name: authName || authEmail.split('@')[0],
          email: authEmail,
          role: authRole
        };
        setCurrentUser(userObj);
        setShowAuthModal(false);
        setAuthEmail('');
        setAuthName('');
        setAuthPassword('');
        if (authRole === 'admin') {
          setActiveTab('admin');
        } else {
          setActiveTab('schemes'); // Take them directly to schemes after successful login
        }
      };

      // Handle Admin Scheme Addition
      const handleAddScheme = (e) => {
        e.preventDefault();
        if (!newTitle || !newDesc) return;
        const newScheme = {
          id: Date.now().toString(),
          title_en: newTitle,
          title_te: newTitle,
          category: newCategory,
          category_en: "General Welfare",
          category_te: "సాధారణ సంక్షేమం",
          description_en: newDesc,
          description_te: newDesc,
          benefits_en: "Financial and welfare support as per state guidelines.",
          benefits_te: "ప్రభుత్వ మార్గదర్శకాల ప్రకారం ఆర్థిక మరియు సంక్షేమ సహాయం.",
          eligibility_en: "Eligible AP residents.",
          eligibility_te: "అర్హత కలిగిన ఏపీ నివాసులు.",
          documents_en: ["Aadhaar Card", "Ration Card"],
          documents_te: ["ఆధార్ కార్డ్", "రేషన్ కార్డ్"],
          official_url: "https://ap.gov.in/",
          verified: true
        };
        setSchemesList([newScheme, ...schemesList]);
        setNewTitle('');
        setNewDesc('');
        alert("New scheme published successfully!");
        setActiveTab('schemes');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER / NAVIGATION */}
          <header className="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => handleTabSwitch('home')}>
                <div className="bg-teal-500 p-2 rounded-lg text-slate-900 font-bold flex items-center justify-center">
                  🌉
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white">{t.brand}</h1>
                  <p className="text-xs text-slate-400 hidden sm:block">{t.tagline}</p>
                </div>
              </div>

              {/* DESKTOP NAV */}
              <nav className="hidden lg:flex items-center gap-5 text-sm font-medium">
                <button onClick={() => handleTabSwitch('home')} className={activeTab === 'home' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navHome}</button>
                <button onClick={() => handleTabSwitch('schemes')} className={activeTab === 'schemes' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navSchemes}</button>
                <button onClick={() => handleTabSwitch('services')} className={activeTab === 'services' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navServices}</button>
                <button onClick={() => handleTabSwitch('finder')} className={activeTab === 'finder' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navFinder}</button>
                <button onClick={() => handleTabSwitch('ai')} className={activeTab === 'ai' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navAI}</button>
                <button onClick={() => handleTabSwitch('survey')} className={activeTab === 'survey' ? 'text-teal-400 font-semibold' : 'text-slate-300 hover:text-white'}>{t.navSurvey}</button>
                {currentUser?.role === 'admin' && (
                  <button onClick={() => handleTabSwitch('admin')} className={activeTab === 'admin' ? 'text-amber-300 font-bold bg-amber-900/40 px-2.5 py-1 rounded border border-amber-500/50' : 'text-amber-400 hover:text-amber-300 font-semibold'}>{t.navAdmin}</button>
                )}
              </nav>

              {/* CONTROLS (Language + Auth) */}
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setLang(lang === 'en' ? 'te' : 'en')}
                  className="bg-slate-800 hover:bg-slate-700 text-teal-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                >
                  🌐 {lang === 'en' ? 'తెలుగు' : 'English'}
                </button>

                {currentUser ? (
                  <div className="flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg">
                    <span className="text-xs font-bold text-teal-300">{currentUser.name} ({currentUser.role})</span>
                    <button onClick={() => { setCurrentUser(null); setActiveTab('home'); }} className="text-xs text-red-400 hover:text-red-300 ml-1 font-medium">
                      {t.signOut}
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setShowAuthModal(true); }}
                    className="bg-teal-600 hover:bg-teal-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm"
                  >
                    {t.signIn}
                  </button>
                )}
              </div>
            </div>

            {/* MOBILE NAV BAR */}
            <div className="lg:hidden flex overflow-x-auto bg-slate-800 px-2 py-2 gap-2 text-xs border-t border-slate-700">
              <button onClick={() => handleTabSwitch('home')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'home' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navHome}</button>
              <button onClick={() => handleTabSwitch('schemes')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'schemes' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navSchemes}</button>
              <button onClick={() => handleTabSwitch('services')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'services' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navServices}</button>
              <button onClick={() => handleTabSwitch('finder')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'finder' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navFinder}</button>
              <button onClick={() => handleTabSwitch('ai')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'ai' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navAI}</button>
              <button onClick={() => handleTabSwitch('survey')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'survey' ? 'bg-teal-500 text-slate-900 font-bold' : 'text-slate-300'}`}>{t.navSurvey}</button>
              {currentUser?.role === 'admin' && (
                <button onClick={() => handleTabSwitch('admin')} className={`px-2.5 py-1 rounded whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-500 text-slate-900 font-bold' : 'text-amber-400'}`}>{t.navAdmin}</button>
              )}
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {/* 1. HOME TAB (Always Accessible) */}
            {activeTab === 'home' && (
              <div className="space-y-8">
                {/* HERO SECTION */}
                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-8 sm:p-12 shadow-xl border border-slate-800">
                  <div className="max-w-2xl space-y-4">
                    <span className="bg-teal-500/20 text-teal-300 text-xs font-semibold px-3 py-1 rounded-full border border-teal-500/30">
                      Andhra Pradesh Welfare & Services Portal
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                      {t.heroTitle}
                    </h2>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      {t.heroSubtitle}
                    </p>
                    <div className="pt-4 flex flex-wrap gap-3">
                      {currentUser ? (
                        <>
                          <button onClick={() => handleTabSwitch('schemes')} className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-teal-500/20">
                            {t.btnExploreSchemes}
                          </button>
                          <button onClick={() => handleTabSwitch('ai')} className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition-all">
                            💬 {t.btnAskAI}
                          </button>
                        </>
                      ) : (
                        <button onClick={() => setShowAuthModal(true)} className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm transition-all shadow-lg shadow-teal-500/20">
                          {t.signIn} to Unlock Portal Features
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* QUICK ACCESS CARDS */}
                <div>
                  <h3 className="text-lg font-bold text-slate-900 mb-4">{t.quickAccessTitle}</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div onClick={() => handleTabSwitch('schemes')} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition-all">
                      <div className="text-3xl mb-2">📜</div>
                      <h4 className="font-bold text-slate-900">{t.navSchemes}</h4>
                      <p className="text-xs text-slate-500 mt-1">Browse verified AP welfare schemes like NTR Bharosa & Annadata Sukhibhava.</p>
                    </div>
                    <div onClick={() => handleTabSwitch('services')} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition-all">
                      <div className="text-3xl mb-2">🌐</div>
                      <h4 className="font-bold text-slate-900">{t.navServices}</h4>
                      <p className="text-xs text-slate-500 mt-1">Direct links to MeeSeva and Secretariat portals.</p>
                    </div>
                    <div onClick={() => handleTabSwitch('finder')} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition-all">
                      <div className="text-3xl mb-2">🎯</div>
                      <h4 className="font-bold text-slate-900">{t.navFinder}</h4>
                      <p className="text-xs text-slate-500 mt-1">Check scheme eligibility in 3 easy steps.</p>
                    </div>
                    <div onClick={() => handleTabSwitch('survey')} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition-all">
                      <div className="text-3xl mb-2">📊</div>
                      <h4 className="font-bold text-slate-900">{t.navSurvey}</h4>
                      <p className="text-xs text-slate-500 mt-1">Explore public awareness indicators and survey findings.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PROTECTED TABS: Render only if currentUser exists, else show login gate */}
            {currentUser ? (
              <>
                {/* 2. SCHEMES DIRECTORY TAB */}
                {activeTab === 'schemes' && (
                  <div className="space-y-6">
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4">
                      <input 
                        type="text"
                        placeholder={t.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                      <select 
                        value={selectedCategory} 
                        onChange={(e) => setSelectedCategory(e.target.value)}
                        className="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                      >
                        <option value="all">{t.allCategories}</option>
                        <option value="pensions">Pensions & Social Security</option>
                        <option value="agriculture">Agriculture & Farmers</option>
                        <option value="education">Education & Students</option>
                        <option value="women">Women & Household Welfare</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {filteredSchemes.map(s => (
                        <div key={s.id} className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between hover:border-teal-500 transition-all">
                          <div className="space-y-3">
                            <div className="flex justify-between items-start">
                              <span className="bg-teal-50 text-teal-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-teal-200">
                                {lang === 'te' ? s.category_te : s.category_en}
                              </span>
                              {s.verified && (
                                <span className="text-emerald-600 text-xs font-medium flex items-center gap-1">
                                  ✓ {t.sourceVerified}
                                </span>
                              )}
                            </div>
                            <h3 className="text-lg font-bold text-slate-900">
                              {lang === 'te' ? s.title_te : s.title_en}
                            </h3>
                            <p className="text-slate-600 text-sm leading-relaxed">
                              {lang === 'te' ? s.description_te : s.description_en}
                            </p>
                          </div>

                          <div className="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between">
                            <button 
                              onClick={() => setSelectedScheme(s)}
                              className="text-teal-700 hover:text-teal-800 font-semibold text-sm flex items-center gap-1"
                            >
                              {t.viewDetails} →
                            </button>
                            <a 
                              href={s.official_url} 
                              target="_blank" 
                              rel="noreferrer"
                              className="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors"
                            >
                              {t.officialWebsite} ↗
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 3. DIGITAL SERVICES TAB */}
                {activeTab === 'services' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">{t.btnExploreServices}</h2>
                      <p className="text-slate-600 text-sm">Direct navigation to verified government citizen portals.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {DIGITAL_SERVICES.map(srv => (
                        <div key={srv.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                          <span className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded font-medium">
                            {srv.category}
                          </span>
                          <h3 className="font-bold text-slate-900">{lang === 'te' ? srv.title_te : srv.title_en}</h3>
                          <p className="text-slate-600 text-xs">{lang === 'te' ? srv.desc_te : srv.desc_en}</p>
                          <a 
                            href={srv.url} 
                            target="_blank" 
                            rel="noreferrer"
                            className="inline-block bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors"
                          >
                            {t.officialWebsite} ↗
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. GUIDED FINDER TAB */}
                {activeTab === 'finder' && (
                  <div className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">{t.finderTitle}</h2>
                      <p className="text-slate-600 text-sm mt-1">{t.finderSubtitle}</p>
                    </div>

                    <form onSubmit={handleFinderSubmit} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Target Assistance Category</label>
                        <select 
                          value={finderForm.goal}
                          onChange={(e) => setFinderForm({ goal: e.target.value })}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white"
                        >
                          <option value="all">All Categories</option>
                          <option value="pension">NTR Bharosa Social Security Pension</option>
                          <option value="agriculture">Annadata Sukhibhava Farmer Support</option>
                          <option value="education">Talliki Vandanam Educational Support</option>
                          <option value="women">Deepam 2.0 Free LPG Gas Cylinders</option>
                        </select>
                      </div>

                      <button type="submit" className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors">
                        Find Eligible Schemes
                      </button>
                    </form>

                    {finderResults && (
                      <div className="pt-6 border-t border-slate-100 space-y-4">
                        <h3 className="font-bold text-slate-900">Recommended Schemes ({finderResults.length})</h3>
                        {finderResults.map(r => (
                          <div key={r.id} className="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                            <h4 className="font-bold text-teal-800 text-sm">{lang === 'te' ? r.title_te : r.title_en}</h4>
                            <p className="text-xs text-slate-600">{lang === 'te' ? r.description_te : r.description_en}</p>
                            <button onClick={() => setSelectedScheme(r)} className="text-xs text-teal-700 font-semibold underline">
                              View Documents Checklist
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* 5. AI CHATBOT TAB */}
                {activeTab === 'ai' && (
                  <div className="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[600px]">
                    <div className="bg-slate-900 text-white p-4 rounded-t-2xl flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">🤖</span>
                        <div>
                          <h3 className="font-bold text-sm">JanSetu AI Assistant</h3>
                          <p className="text-xs text-teal-400">Online • Grounded on Verified Scheme Database</p>
                        </div>
                      </div>
                    </div>

                    <div className="flex-1 p-4 overflow-y-auto space-y-3">
                      {chatMessages.map((msg, idx) => (
                        <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[80%] rounded-xl p-3 text-sm leading-relaxed ${
                            msg.sender === 'user' ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-800'
                          }`}>
                            {msg.text}
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="p-3 border-t border-slate-200 flex gap-2">
                      <input 
                        type="text" 
                        placeholder={t.chatPlaceholder}
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                        className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                      <button onClick={() => handleSendMessage()} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                        Send
                      </button>
                    </div>
                  </div>
                )}

                {/* 6. SURVEY DASHBOARD TAB */}
                {activeTab === 'survey' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900">{t.surveyTitle}</h2>
                      <p className="text-slate-600 text-sm">{t.surveySubtitle}</p>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-900 text-sm">Public Awareness Indicators (%)</h3>
                      <div className="space-y-3">
                        {SURVEY_DATA.map((item, index) => (
                          <div key={index} className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-700">
                              <span>{item.category}</span>
                              <span>{item.aware}% Aware</span>
                            </div>
                            <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden flex">
                              <div style={{ width: `${item.aware}%` }} className="bg-teal-500 h-full"></div>
                              <div style={{ width: `${item.unaware}%` }} className="bg-slate-300 h-full"></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* 7. ADMIN TAB */}
                {activeTab === 'admin' && currentUser?.role === 'admin' && (
                  <div className="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-amber-200 shadow-sm space-y-6">
                    <div className="bg-amber-50 border border-amber-300 p-4 rounded-xl text-xs text-amber-900 font-semibold">
                      {t.adminActiveNotice}
                    </div>
                    <h2 className="text-xl font-bold text-slate-900">Publish New Welfare Scheme</h2>
                    <form onSubmit={handleAddScheme} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Scheme Title</label>
                        <input 
                          type="text" 
                          placeholder="e.g., Rythu Nestham" 
                          value={newTitle} 
                          onChange={(e) => setNewTitle(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                          required 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Category</label>
                        <select 
                          value={newCategory} 
                          onChange={(e) => setNewCategory(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white"
                        >
                          <option value="pensions">Pensions & Social Security</option>
                          <option value="agriculture">Agriculture & Farmers</option>
                          <option value="education">Education & Students</option>
                          <option value="women">Women & Household Welfare</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Description & Benefits</label>
                        <textarea 
                          placeholder="Enter scheme overview..." 
                          value={newDesc} 
                          onChange={(e) => setNewDesc(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg p-2.5 text-sm h-24"
                          required 
                        />
                      </div>
                      <button type="submit" className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors">
                        Publish Scheme to Directory
                      </button>
                    </form>
                  </div>
                )}
              </>
            ) : null}

          </main>

          {/* SCHEME DETAIL MODAL */}
          {selectedScheme && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-start">
                  <h3 className="text-xl font-bold text-slate-900">
                    {lang === 'te' ? selectedScheme.title_te : selectedScheme.title_en}
                  </h3>
                  <button onClick={() => setSelectedScheme(null)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <div className="space-y-3 text-sm text-slate-700">
                  <div>
                    <h4 className="font-bold text-xs uppercase text-teal-800">{t.benefitsTitle}</h4>
                    <p className="mt-0.5">{lang === 'te' ? selectedScheme.benefits_te : selectedScheme.benefits_en}</p>
                  </div>
                  <div>
                    <h4 className="font-bold text-xs uppercase text-teal-800">{t.eligibilityTitle}</h4>
                    <p className="mt-0.5">{lang === 'te' ? selectedScheme.eligibility_te : selectedScheme.eligibility_en}</p>
                  </div>
                  <div>
                    <h4 className="font-bold text-xs uppercase text-teal-800">{t.documentsTitle}</h4>
                    <ul className="list-disc pl-5 mt-1 space-y-0.5 text-xs">
                      {(lang === 'te' ? selectedScheme.documents_te : selectedScheme.documents_en).map((doc, idx) => (
                        <li key={idx}>{doc}</li>
                      ))}
                    </ul>
                  </div>
                </div>

                <div className="pt-4 border-t flex justify-end gap-2">
                  <button onClick={() => setSelectedScheme(null)} className="px-4 py-2 rounded-lg text-slate-600 text-xs font-bold border">Close</button>
                  <a href={selectedScheme.official_url} target="_blank" rel="noreferrer" className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-xs font-bold">
                    {t.officialWebsite} ↗
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL (SIGN IN / REGISTER) */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
                <div>
                  <h3 className="text-xl font-bold text-slate-900">
                    {authMode === 'login' ? 'Sign In to JanSetu' : 'Create New Account'}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">Select your role and enter your credentials.</p>
                </div>

                {/* Role Tabs */}
                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                  <button 
                    type="button" 
                    onClick={() => setAuthRole('citizen')}
                    className={`py-1.5 rounded-lg text-xs font-bold transition-all ${authRole === 'citizen' ? 'bg-white text-teal-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    Citizen
                  </button>
                  <button 
                    type="button" 
                    onClick={() => setAuthRole('admin')}
                    className={`py-1.5 rounded-lg text-xs font-bold transition-all ${authRole === 'admin' ? 'bg-white text-amber-800 shadow-sm' : 'text-slate-600'}`}
                  >
                    Administrator
                  </button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Full Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g., Ramesh Kumar" 
                        value={authName} 
                        onChange={(e) => setAuthName(e.target.value)}
                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm" 
                        required 
                      />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address</label>
                    <input 
                      type="email" 
                      placeholder="user@domain.com" 
                      value={authEmail} 
                      onChange={(e) => setAuthEmail(e.target.value)}
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <input 
                      type="password" 
                      placeholder="••••••••" 
                      value={authPassword} 
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-sm" 
                      required 
                    />
                  </div>

                  <button type="submit" className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors mt-2">
                    {authMode === 'login' ? 'Sign In' : 'Register Account'}
                  </button>
                </form>

                <div className="pt-2 text-center text-xs text-slate-600">
                  {authMode === 'login' ? (
                    <p>Don't have an account? <button onClick={() => setAuthMode('signup')} className="text-teal-700 font-bold underline">Register here</button></p>
                  ) : (
                    <p>Already have an account? <button onClick={() => setAuthMode('login')} className="text-teal-700 font-bold underline">Sign In</button></p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 text-xs py-8 border-t border-slate-900 mt-12">
            <div className="max-w-7xl mx-auto px-4 space-y-4 text-center sm:text-left sm:flex sm:justify-between sm:items-center">
              <div>
                <p className="font-bold text-white text-sm">{t.brand}</p>
                <p className="mt-1">{t.disclaimerFooter}</p>
              </div>
              <div className="text-slate-500 text-xs">
                © 2026 JanSetu Community Initiative
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
